# Wake from s2idle when a USB4/Thunderbolt device (dock) is plugged in.
# usb4_port devices have no udev subsystem, so this can't be a udev rule.
# Uses the canonical /sys/devices path: tmpfiles won't write through the
# /sys/bus/thunderbolt/devices/* symlinks.
# Install: sudo cp usb4-wake.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create /etc/tmpfiles.d/usb4-wake.conf
w /sys/devices/pci*/*/*/domain*/*-0/usb4_port*/power/wakeup - - - - enabled
