# Short press sleeps (s2idle - this machine has no S3), long press powers off.
# Default was HandlePowerKey=poweroff, which shut the machine down on Oct 8 when
# the power button was pressed to wake dark screens.
# Install: /etc/systemd/logind.conf.d/20-power-key.conf
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
